apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: capstone
        orgId: 1
        folder: Capstone
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
  capstone-overview.json: |
    {
      "title": "Capstone — App & Cluster",
      "uid": "capstone-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "stat",
          "title": "App pods up (scrape)",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
          "targets": [{
            "expr": "count(up{job=\"kubernetes-pods\", kubernetes_namespace=\"capstone-app\"} == 1)",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "HTTP requests / sec",
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 0},
          "targets": [{
            "expr": "sum(rate(app_requests_total{kubernetes_namespace=\"capstone-app\"}[5m]))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Ready capstone-app pods",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 4},
          "targets": [{
            "expr": "sum(kube_pod_status_ready{namespace=\"capstone-app\", condition=\"true\"})",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "title": "Node CPU % (node-exporter)",
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 8},
          "targets": [{
            "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\",job=\"node-exporter\"}[5m])) * 100)",
            "refId": "A"
          }]
        }
      ]
    }

# Manual HPA load test. Not applied by the pipeline (the Deploy stage applies
# named files only, and `kubectl apply -f kubernetes/` does not recurse into tests/).
#
# Usage:
#   kubectl apply -f kubernetes/tests/load-generator.yaml
#   kubectl get hpa -n capstone-app -w
#   kubectl delete -f kubernetes/tests/load-generator.yaml
#
# For more load, apply a second copy with a different name:
#   sed 's/name: load-generator/name: load-generator-2/' kubernetes/tests/load-generator.yaml | kubectl apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: capstone-app
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6 7 8; do
            (while true; do wget -q -O- http://capstone-app/health > /dev/null; done) &
          done
          wait
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi

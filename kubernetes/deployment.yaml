apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-app
  namespace: capstone-app
  labels:
    app: capstone-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-app
  template:
    metadata:
      labels:
        app: capstone-app
    spec:
      containers:
        - name: capstone-app
          # This tag is replaced at deploy time by the Jenkins pipeline
          # (see jenkins/Jenkinsfile Deploy stage) — kept as "latest" here
          # only as a placeholder for local/manual apply.
          image: 562904760755.dkr.ecr.ap-south-1.amazonaws.com/devops-capstone-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

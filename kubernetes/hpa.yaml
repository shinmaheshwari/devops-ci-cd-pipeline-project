apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-app
  namespace: capstone-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
